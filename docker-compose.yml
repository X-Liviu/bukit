# Postgres local para desarrollo, tests y CI.
# Imagen personalizada (ver docker/postgres/Dockerfile) = PostGIS + pgvector juntos,
# en las mismas versiones que la base de producción (Neon).
# Producción NO usa esto: vive en Neon (UE). Estas credenciales son solo de dev.
services:
  db:
    build: ./docker/postgres
    # La etiqueta lleva las versiones (10-10-2026): `docker compose up` solo
    # construye si la etiqueta no existe, así que con una fija (antes
    # bukit-postgres:16) un cambio del Dockerfile no se notaba y se seguía
    # usando la imagen vieja sin aviso. Al cambiar versiones en el Dockerfile,
    # cambiar también esta etiqueta y la de .github/workflows/ci.yml.
    image: bukit-postgres:16.15-postgis3.3.10-pgvector0.8.0
    container_name: bukit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bukit
      POSTGRES_PASSWORD: bukit
      POSTGRES_DB: bukit
    ports:
      - "5432:5432"
    volumes:
      - bukit-db-data:/var/lib/postgresql/data
      # Habilita las extensiones al crear la BD por primera vez:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1 fuerza la comprobación por TCP: durante el initdb del
      # primer arranque, Postgres levanta un servidor temporal SOLO con socket
      # unix para ejecutar los scripts de init, y pg_isready sin -h daría
      # healthy en esa ventana aunque el puerto 5432 aún no acepte conexiones
      # (flake real de CI: migrate llegaría antes que el TCP).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bukit -d bukit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  bukit-db-data:
