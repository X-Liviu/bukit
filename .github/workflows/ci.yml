# =========================================================================
# Integración continua del monorepo (US-01; jobs separados desde el
# 06-08-2026, cerrando el pendiente anotado el 27-07).
# Estrategia de fallo rápido del cap. 10, ahora por jobs: lint (barrera
# estática barata) → typecheck → pruebas, y la build de la imagen Docker
# de la API en paralelo desde que lint aprueba (no depende de tipos ni
# pruebas). Las E2E (Playwright) entrarán como última barrera cuando haya
# aplicación que arrancar.
#
# Instalación reutilizada = caché del store de pnpm (setup-node cache:
# pnpm): cada job instala desde el store cacheado en segundos (solo
# enlaza). Alternativa descartada: pasar node_modules como artefacto entre
# jobs — el node_modules de pnpm es una granja de symlinks al store
# virtual y upload-artifact no los conserva (los desreferencia), así que
# el artefacto se infla a cientos de MB, tarda más que instalar desde la
# caché y puede llegar roto. Los pasos comunes viven en la composite
# action .github/actions/setup.
#
# Cada job es además un "check" con nombre propio: el gating de despliegue
# de Render (autoDeployTrigger: checksPass, render.yaml) espera a TODOS
# antes de desplegar, y un fallo se localiza de un vistazo.
# =========================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama: solo
# interesa el estado del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# timeout-minutes en cada job: el 06-08-2026 dos runs consecutivos (con sus
# reintentos) se colgaron en la preparación y hubo que cancelarlos a mano
# tras ~15 min; la causa no se pudo determinar (incidencia transitoria de
# los runners: al día siguiente el rerun pasó en verde sin ningún cambio) y
# el tope evita que un cuelgue así queme minutos o espere al límite de 6 h.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Mitigación R14 (10-08-2026): la auditoría de dependencias corre en
      # cada push y corta la CI si hay vulnerabilidades de severidad alta o
      # crítica en dependencias de producción. Dependabot complementa: audit
      # corta si algo grave ya está dentro; Dependabot propone la salida.
      - run: pnpm audit --prod --audit-level high

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # prisma generate, restaurado en la US-04 tal y como quedó previsto: el
      # esquema ya tiene su primer modelo (User) y el typecheck necesita el
      # cliente tipado generado.
      - run: pnpm --filter @bukit/api prisma:generate
      - run: pnpm typecheck

  pruebas:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Credenciales SOLO de desarrollo: las mismas del docker-compose del repo.
      DATABASE_URL: postgresql://bukit:bukit@localhost:5432/bukit?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bukit/api prisma:generate
      # BD real para las pruebas de integración (US-04): el mismo compose de
      # desarrollo (imagen propia PostGIS + pgvector), esperado hasta healthy,
      # con el esquema aplicado desde las migraciones versionadas.
      - run: docker compose up -d --wait
      - run: pnpm --filter @bukit/api db:deploy
      - run: pnpm test

  docker:
    # Solo la barrera estática como puerta: así el Dockerfile se valida en
    # paralelo a typecheck/pruebas sin quemar minutos si lint ya falló.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build de la imagen de la API (sin publicar)
        run: docker build -f apps/api/Dockerfile -t bukit-api:ci .
      # Humo (US-04): la imagen debe ARRANCAR y responder /health sin BD (el
      # cliente Prisma se genera en la build y se construye perezoso). Una
      # imagen que compila pero muere al arrancar pasaba inadvertida: la CI
      # solo construía, nunca ejecutaba.
      - name: La imagen arranca y /health responde
        run: |
          docker run -d --rm --name bukit-api-ci -p 3001:3001 bukit-api:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 2
          done
          docker logs bukit-api-ci
          exit 1
